name: Commit
on:
    push:
        branches: [master]
    # Without this, a pull request from a fork is never tested: push only fires for branches
    # in this repository.
    pull_request:

# Nothing here writes to the repository, so the token should not be able to either.
permissions:
    contents: read

jobs:
    check:
        name: lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              name: Install pnpm
              with:
                  run_install: false
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm
            - name: Installing dependencies
              run: pnpm install --frozen-lockfile
            # Production dependencies only: those are what a consumer of the package installs.
            - name: Audit
              run: pnpm audit --prod --audit-level high
            - name: Test
              run: pnpm test
            - name: Typecheck
              run: pnpm typecheck
            - name: Format
              run: pnpm format
            - name: Build
              run: pnpm build
